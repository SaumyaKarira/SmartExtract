# DataSource - configured via environment variables
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smart_extract_db}
spring.datasource.username=${DB_USERNAME:smart_user}
spring.datasource.password=${DB_PASSWORD:smart-test}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - Flyway owns the schema, disable Hibernate DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# JWT
# WARNING: Override JWT_SECRET in production with a strong random Base64-encoded 256-bit key.
# The default below is for local development only and must never be used in production.
app.jwt.secret=${JWT_SECRET:c2VjcmV0LXRoaXMtaXMtYS12ZXJ5LWxvbmctc2VjcmV0LWtleS1mb3Itc21hcnQtZXh0cmFjdC1kZXY=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Gemini
app.gemini.api-key=${GEMINI_API_KEY}
app.gemini.model=gemini-2.5-flash

# Gemini resilience
# Per-attempt timeout: OkHttp cancels the real HTTP socket when this fires (no shadow threads).
# 3 attempts x 10s + 2 backoffs = ~30s max wall-clock time shown as "Uploading..." in the UI.
app.gemini.resilience.timeout-ms=${GEMINI_TIMEOUT_MS:10000}
app.gemini.resilience.max-attempts=${GEMINI_MAX_ATTEMPTS:3}
app.gemini.resilience.backoff-base-ms=${GEMINI_BACKOFF_BASE_MS:1000}
app.gemini.resilience.backoff-max-ms=${GEMINI_BACKOFF_MAX_MS:8000}
app.gemini.resilience.retry-after-max-ms=${GEMINI_RETRY_AFTER_MAX_MS:15000}

# Multipart uploads - allow up to 10 MB per file (matches application-level validation)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB


server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

