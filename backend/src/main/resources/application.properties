# DataSource - configured via environment variables
spring.datasource.url=${JDBC_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - Flyway owns the schema, disable Hibernate DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# JWT
# WARNING: Override JWT_SECRET in production with a strong random Base64-encoded 256-bit key.
# The default below is for local development only and must never be used in production.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Gemini
app.gemini.api-key=${GEMINI_API_KEY}
app.gemini.model=gemini-3.6-flash

# Gemini resilience
# Per-attempt timeout: OkHttp cancels the real HTTP socket when this fires (no shadow threads).
# 60s per attempt: Gemini flash can take 20-40s on complex documents; 10s was too low.
# 3 attempts x 60s + 2 backoffs = ~130s max wall-clock time in the worst case.
app.gemini.resilience.timeout-ms=${GEMINI_TIMEOUT_MS:60000}
app.gemini.resilience.max-attempts=${GEMINI_MAX_ATTEMPTS:3}
app.gemini.resilience.backoff-base-ms=${GEMINI_BACKOFF_BASE_MS:1000}
app.gemini.resilience.backoff-max-ms=${GEMINI_BACKOFF_MAX_MS:8000}
app.gemini.resilience.retry-after-max-ms=${GEMINI_RETRY_AFTER_MAX_MS:15000}

# Multipart uploads - allow up to 10 MB per file (matches application-level validation)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB


server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

